[alembic]

# Location of the Alembic migration environment.
script_location = %(here)s/alembic

# Add the backend directory to Python's import path.
prepend_sys_path = .

# Character used to separate multiple paths.
path_separator = os

# The real database URL is loaded from backend/.env
# inside alembic/env.py.
sqlalchemy.url = postgresql+psycopg://placeholder:placeholder@localhost/placeholder


[post_write_hooks]

# Optional hooks can be added later.


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console
qualname =


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S